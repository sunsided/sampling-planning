[package]
name = "sampling-planning"
description = "Sampling-based motion planning for no_std: RRT, RRT*, RRT-Connect, PRM, SPARS, FMT*, BIT*, ABIT*, AIT*, EIT*, SST and KPIECE"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/sampling-planning"
homepage = "https://sunsided.github.io/planning-and-search/crates/sampling-planning/"
readme = "README.md"
keywords = ["motion-planning", "rrt", "prm", "path-planning", "robotics"]
categories = ["science::robotics", "algorithms", "no-std"]
# Repository tooling stays out of the published crate.
exclude = [
    ".github/",
    "scripts/",
    ".pre-commit-config.yaml",
    "Taskfile.dist.yaml",
    "_typos.toml",
    "clippy.toml",
    "codecov.yml",
    "deny.toml",
    "release-plz.toml",
    "rustfmt.toml",
]

[features]
## Links `std`. No API of its own; required by `parallel`.
std = []
## Multi-threaded batch validity checks (`ParallelChecker`) and batched roadmap queries
## (`Prm::query_batch`) on `std::thread::scope`.
parallel = ["std"]

[dependencies]
libm = "0.2.16"
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.11.0"
rand_pcg = "0.10.2"

# The planner integration tests run thousands of motion checks; unoptimized they take minutes.
[profile.test]
opt-level = 2

[[bench]]
name = "nearest"
harness = false

[[bench]]
name = "spaces"
harness = false

[[bench]]
name = "retirement"
harness = false

[[bench]]
name = "parallel"
harness = false
required-features = ["parallel"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "docs/mermaid.html"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
mod_module_files = "deny"
missing_docs_in_private_items = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
cognitive_complexity = "warn"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"
