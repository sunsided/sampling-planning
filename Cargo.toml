[package]
name = "sampling-planning"
description = "Motion planning with sampling-based planners: RRT, RRT*, RRT#, PRM, FMT*, BIT*, SST and KPIECE"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/sunsided/sampling-planning"
readme = "README.md"
keywords = ["motion-planning", "rrt", "robotics", "prm", "path-planning"]
categories = ["science::robotics", "algorithms", "no-std"]

[dependencies]
libm = "0.2.16"
rand_core = { version = "0.10.1", default-features = false }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
rand_pcg = "0.10.2"

# The planner integration tests run thousands of motion checks; unoptimized they take minutes.
[profile.test]
opt-level = 2

[[bench]]
name = "nearest"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
